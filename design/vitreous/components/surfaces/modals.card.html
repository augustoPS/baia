<!-- @dsCard group="Components" viewport="700x290" name="Modals" subtitle="Sheet and alert on floating glass" -->
<!DOCTYPE html>
<html lang="en" data-appearance="dark" data-accent="blue" data-motion="low"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ds-runtime.js"></script>
<style>
  html, body { margin: 0; }
  body {
    font-family: var(--font-system); color: var(--label);
    background: var(--desktop-image) center/cover no-repeat, var(--desktop-ground);
    padding: 16px 18px; box-sizing: border-box; -webkit-font-smoothing: antialiased;
  }
  .caps { font: var(--type-caps); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--label-tertiary); }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--link-hover); }
</style></head><body><div id="root"></div>
<script type="text/jsx" id="demo">
const { Sheet, Alert, Button, TextField } = window.VG;
function Demo() {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
      <div style={{ position: "relative", height: 250, borderRadius: "var(--r-window)", overflow: "hidden", boxShadow: "var(--shadow-window)", background: "var(--mat-fill-regular)", backdropFilter: "var(--mat-regular)" }}>
        <Sheet open title="New session" message="The agent starts in this directory with read-only tools." width={320}
          actions={<><Button size="small">Cancel</Button><Button size="small" variant="accent">Create</Button></>}>
          <TextField label="Working directory" mono defaultValue="~/src/atlas" />
        </Sheet>
      </div>
      <div style={{ position: "relative", height: 250, borderRadius: "var(--r-window)", overflow: "hidden", boxShadow: "var(--shadow-window)", background: "var(--mat-fill-regular)", backdropFilter: "var(--mat-regular)" }}>
        <Alert open severity="warning" title="Discard 3 uncommitted changes?" width={300}
          message="The agent will reset the worktree before retrying."
          actions={<><Button size="small">Cancel</Button><Button size="small" variant="destructive">Discard</Button></>} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
<script>VG_RUN("demo");</script>
</body></html>
