<!-- @dsCard group="Motion" viewport="700x160" name="Interaction states" subtitle="Fill brightens on hover, control scales on press, accent ring on focus" -->
<!DOCTYPE html>
<html lang="en" data-appearance="dark" data-accent="blue" data-motion="low"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body {
    font-family: var(--font-system); color: var(--label);
    background: var(--desktop-image) center/cover no-repeat, var(--desktop-ground);
    padding: 16px 18px; box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .grid { display: grid; gap: 10px; }
  .caps { font: var(--type-caps); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--label-tertiary); }
  .mono { font: var(--type-mono); color: var(--label-secondary); }
  .tag { font: var(--fw-medium) 10px/1.35 var(--font-mono); color: var(--label-secondary); }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--link-hover); }
  .st { display: grid; gap: 8px; justify-items: center; }
.st i { font-style: normal; font: var(--fw-medium) 10px/1.4 var(--font-mono); color: var(--label-tertiary); }
.b { height: 22px; padding: 0 12px; border-radius: var(--r-3); font: var(--type-control); display: inline-flex; align-items: center; background: var(--fill); backdrop-filter: var(--mat-ultra-thin); box-shadow: var(--lens-rim), var(--shadow-control); }
</style></head><body>
<div class="row" style="gap: 22px">
  <span class="st"><span class="b">rest</span><i>fill .10</i></span>
  <span class="st"><span class="b" style="background: rgba(255,255,255,.14)">hover</span><i>fill ×1.4 · 140ms</i></span>
  <span class="st"><span class="b" style="background: var(--fill-secondary); transform: scale(.98)">press</span><i>scale .98 · 90ms</i></span>
  <span class="st"><span class="b" style="box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--focus-ring)">focus</span><i>1px + 3px ring</i></span>
  <span class="st"><span class="b" style="opacity:.36">disabled</span><i>opacity .36</i></span>
</div>
</body></html>
