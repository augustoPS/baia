<!-- @dsCard group="Appearance" viewport="700x200" name="Desktop backdrop" subtitle="Glass needs a wallpaper: without one the system reads as flat grey" -->
<!DOCTYPE html>
<html lang="en" data-appearance="dark" data-accent="blue" data-motion="low"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body {
    font-family: var(--font-system); color: var(--label);
    background: var(--desktop-image) center/cover no-repeat, var(--desktop-ground);
    padding: 16px 18px; box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .grid { display: grid; gap: 10px; }
  .caps { font: var(--type-caps); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--label-tertiary); }
  .mono { font: var(--type-mono); color: var(--label-secondary); }
  .tag { font: var(--fw-medium) 10px/1.35 var(--font-mono); color: var(--label-secondary); }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--link-hover); }
  .w { position: relative; height: 150px; border-radius: var(--r-window); overflow: hidden; box-shadow: var(--shadow-window); background: var(--desktop-image) center/cover; }
.w .g { position: absolute; inset: 26px 18px 18px; border-radius: var(--r-6); background: var(--mat-fill-regular); background-image: var(--lens-sheen), var(--lens-refract); backdrop-filter: var(--mat-regular); box-shadow: var(--lens-rim-strong), var(--shadow-sheet); display: grid; place-items: center; font: var(--type-headline); }
.flat { position: relative; height: 150px; border-radius: var(--r-window); overflow: hidden; box-shadow: var(--shadow-window); background: #1b1d20; }
.flat .g { position: absolute; inset: 26px 18px 18px; border-radius: var(--r-6); background: rgba(255,255,255,.12); box-shadow: var(--lens-rim); display: grid; place-items: center; font: var(--type-headline); color: var(--label-secondary); }
</style></head><body>
<div class="grid" style="grid-template-columns: 1fr 1fr; gap: 14px">
  <div class="w"><div class="g">glass on wallpaper</div></div>
  <div class="flat"><div class="g">same fill, no backdrop</div></div>
</div>
</body></html>
