<!-- @dsCard group="Motion" viewport="700x175" name="Low & high" subtitle="[data-motion] switches the whole system; low is the default" -->
<!DOCTYPE html>
<html lang="en" data-appearance="dark" data-accent="blue" data-motion="low"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body {
    font-family: var(--font-system); color: var(--label);
    background: var(--desktop-image) center/cover no-repeat, var(--desktop-ground);
    padding: 16px 18px; box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .grid { display: grid; gap: 10px; }
  .caps { font: var(--type-caps); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--label-tertiary); }
  .mono { font: var(--type-mono); color: var(--label-secondary); }
  .tag { font: var(--fw-medium) 10px/1.35 var(--font-mono); color: var(--label-secondary); }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--link-hover); }
  .m { display: grid; gap: 8px; padding: 12px; border-radius: var(--r-5); background: var(--mat-fill-thin); backdrop-filter: var(--mat-thin); box-shadow: var(--lens-rim), var(--shadow-control); }
.m b { font: var(--type-headline); }
.m i { font-style: normal; font: var(--fw-medium) 10px/1.5 var(--font-mono); color: var(--label-secondary); }
.puck { height: 6px; width: 30%; border-radius: 999px; background: var(--accent); }
.low .puck { animation: slide 2.2s var(--ease-standard) infinite alternate; }
.high .puck { animation: slide 1.4s var(--spring-bouncy) infinite alternate; }
@keyframes slide { from { transform: translateX(0) } to { transform: translateX(210%) } }
</style></head><body>
<div class="grid" style="grid-template-columns: 1fr 1fr; gap: 14px">
  <div class="m low"><b>low · default</b><i>ease (.32,.72,0,1)<br>90 / 140 / 220 / 340ms · press .98</i><span class="puck"></span></div>
  <div class="m high" data-motion="high"><b>high</b><i>spring (.34,1.42,.64,1)<br>elastic sheets · sweeps · press .955</i><span class="puck"></span></div>
</div>
</body></html>
