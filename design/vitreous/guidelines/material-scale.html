<!-- @dsCard group="Materials" viewport="700x180" name="Material scale" subtitle="ultraThin → thick: fill rises, blur rises, backdrop recedes" -->
<!DOCTYPE html>
<html lang="en" data-appearance="dark" data-accent="blue" data-motion="low"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body {
    font-family: var(--font-system); color: var(--label);
    background: var(--desktop-image) center/cover no-repeat, var(--desktop-ground);
    padding: 16px 18px; box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .grid { display: grid; gap: 10px; }
  .caps { font: var(--type-caps); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--label-tertiary); }
  .mono { font: var(--type-mono); color: var(--label-secondary); }
  .tag { font: var(--fw-medium) 10px/1.35 var(--font-mono); color: var(--label-secondary); }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--link-hover); }
  .m { border-radius: var(--r-5); padding: 10px; height: 108px; box-sizing: border-box; display: grid; align-content: end; gap: 2px; }
.m b { font: var(--type-headline); }
.m i { font-style: normal; font: var(--fw-medium) 10px/1.4 var(--font-mono); color: var(--label-secondary); }
</style></head><body>
<div class="grid" style="grid-template-columns: repeat(4, 1fr)">
  <div class="m" style="background: var(--mat-fill-ultra-thin); backdrop-filter: var(--mat-ultra-thin); box-shadow: var(--lens-rim), var(--shadow-control)"><b>ultraThin</b><i>.055 · blur 14<br>sat 180%</i></div>
  <div class="m" style="background: var(--mat-fill-thin); backdrop-filter: var(--mat-thin); box-shadow: var(--lens-rim), var(--shadow-raised)"><b>thin</b><i>.085 · blur 24<br>sat 180%</i></div>
  <div class="m" style="background: var(--mat-fill-regular); backdrop-filter: var(--mat-regular); box-shadow: var(--lens-rim-strong), var(--shadow-raised)"><b>regular</b><i>.12 · blur 40<br>sat 190%</i></div>
  <div class="m" style="background: var(--mat-fill-thick); backdrop-filter: var(--mat-thick); box-shadow: var(--lens-rim-strong), var(--shadow-popover)"><b>thick</b><i>.17 · blur 60<br>sat 160%</i></div>
</div>
</body></html>
