<!-- @dsCard group="Appearance" viewport="700x200" name="Dark · Light · Tinted" subtitle="Same tokens, three scopes; tinted is the readability fallback" -->
<!DOCTYPE html>
<html lang="en" data-appearance="dark" data-accent="blue" data-motion="low"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body {
    font-family: var(--font-system); color: var(--label);
    background: var(--desktop-image) center/cover no-repeat, var(--desktop-ground);
    padding: 16px 18px; box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .grid { display: grid; gap: 10px; }
  .caps { font: var(--type-caps); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--label-tertiary); }
  .mono { font: var(--type-mono); color: var(--label-secondary); }
  .tag { font: var(--fw-medium) 10px/1.35 var(--font-mono); color: var(--label-secondary); }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--link-hover); }
  .pane { border-radius: var(--r-5); overflow: hidden; box-shadow: var(--shadow-window); }
.bar { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; background: var(--mat-fill-chrome); backdrop-filter: var(--mat-chrome); box-shadow: inset 0 -0.5px 0 var(--separator), inset 0 .5px 0 var(--rim-top); }
.dot { width: 8px; height: 8px; border-radius: 999px; }
.body { padding: 10px; display: grid; gap: 6px; background: var(--mat-fill-regular); backdrop-filter: var(--mat-regular); }
.body b { font: var(--type-headline); color: var(--label); }
.body span { font: var(--type-subheadline); color: var(--label-secondary); }
.pill { justify-self: start; font: var(--fw-semibold) 10px/1 var(--font-system); padding: 3px 7px; border-radius: 999px; background: var(--accent); color: var(--label-on-accent); box-shadow: var(--lens-rim); }
</style></head><body>
<div class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 14px">
  <div class="pane" data-appearance="dark">
    <div class="bar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i></div>
    <div class="body"><b>Dark</b><span>label 96% · secondary 60%</span><span class="pill">accent</span></div>
  </div>
  <div class="pane" data-appearance="light">
    <div class="bar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i></div>
    <div class="body"><b>Light</b><span>label 90% · secondary 55%</span><span class="pill">accent</span></div>
  </div>
  <div class="pane" data-appearance="dark" data-glass="tinted">
    <div class="bar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i></div>
    <div class="body"><b>Tinted</b><span>opacity ≥ .80 · blur ≤ 18</span><span class="pill">accent</span></div>
  </div>
</div>
</body></html>
