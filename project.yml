name: baia

options:
  bundleIdPrefix: pasqualotto
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  # Pinned to a LOCAL checkout only while the read-text change is unmerged
  # upstream. The standing decision is to depend on `Lakr233/libghostty-spm`
  # rather than fork it, so this is a patch in flight and not a divergence: the
  # day it merges this reverts to `url:` plus a version pin and the whole
  # `upstream/` directory goes.
  #
  # The checkout is NOT tracked. `make upstream`, which `make gen` depends on,
  # recreates it from the two files that are tracked: the revision in
  # `upstream/libghostty-spm.ref` (b093203, the 1.3.1 SwiftPM had already
  # resolved, so the patch is the only difference from the unpatched build) and
  # `upstream/libghostty-spm.patch`. Without that target a path pin
  # would be machine-local and a fresh clone would not build anywhere, with
  # nothing on screen to say why.
  libghostty:
    path: upstream/libghostty-spm
  ProjectAnchor:
    path: Packages/ProjectAnchor
  WorkspaceLayout:
    path: Packages/WorkspaceLayout
  WorkspaceMenu:
    path: Packages/WorkspaceMenu
  PaneChrome:
    path: Packages/PaneChrome
  GitWorkspace:
    path: Packages/GitWorkspace
  PaneActivity:
    path: Packages/PaneActivity
  BaiaSettings:
    path: Packages/BaiaSettings
  PaneSearch:
    path: Packages/PaneSearch
  PaneControl:
    path: Packages/PaneControl
  PanePrompt:
    path: Packages/PanePrompt
  PaneCLI:
    path: Packages/PaneCLI
  AgentIntegration:
    path: Packages/AgentIntegration

targets:
  baia:
    type: application
    platform: macOS

    sources:
      - path: Sources
      # The two icons only. `Icon/make-icon.swift` is a script that draws them,
      # run by hand with `swift Icon/make-icon.swift`, and naming the directory
      # here instead of the files would compile that script into the app as a
      # second `main`. Both ship in both bundles; Info.plist's CFBundleIconFile
      # is `$(PRODUCT_NAME)`, which already differs per configuration, so each
      # build picks its own file out of the two at launch.
      - path: Icon/baia.icns
        buildPhase: resources
      - path: Icon/baia-dev.icns
        buildPhase: resources
      # MIT requires the copyright notice to travel with binary distributions
      # and not only with source, so a `NOTICE` sitting at the repository root
      # discharges nothing: `sources` is explicit paths rather than a root glob,
      # which is exactly why the notice was missing from every build up to 2.
      # `NOTICE` and not `LICENSE`, because it already carries baia's own
      # copyright line, ghostty's, libghostty-spm's, iTerm2-Color-Schemes' and
      # MSDisplayLink's, plus the one MIT text that governs all five.
      - path: NOTICE
        buildPhase: resources

    # Info.plist and baia.entitlements are hand-maintained and wired in through
    # build settings below. Do NOT add `info:` or `entitlements:` keys here:
    # XcodeGen treats those as files it owns and overwrites them with generated
    # stubs on every `make gen`, silently dropping their contents.

    dependencies:
      - package: libghostty
        product: GhosttyTerminal
      - package: libghostty
        product: GhosttyTheme
      - package: ProjectAnchor
      - package: WorkspaceLayout
      - package: WorkspaceMenu
      - package: PaneChrome
      - package: GitWorkspace
      - package: PaneActivity
      - package: BaiaSettings
      - package: PaneSearch
      - package: PaneControl
      - package: PanePrompt
      # Only for the outdated-install notice at launch. The installer itself is
      # a CLI subcommand and the app never runs it.
      - package: AgentIntegration

      # The CLI, copied into the bundle it talks to.
      #
      # `destination: wrapper` with `subpath: Contents/Helpers` lands the product
      # at `baia.app/Contents/Helpers/baia`. Measured, not assumed, and the
      # obvious spelling is the wrong one: XcodeGen's `wrapper` is the copy-files
      # destination Xcode calls Wrapper, and for a macOS application that is the
      # `.app` **root**, not `Contents`. `subpath: Helpers` therefore writes
      # `baia.app/Helpers/baia`, and the build then fails at the app's own
      # signing step with "unsealed contents present in the bundle root", which
      # names neither this target nor this phase.
      #
      # `Contents/Helpers` rather than somewhere invented: it is one of the
      # directories codesign recognises as holding nested code, so the helper is
      # sealed as code inside the app rather than as a stray resource.
      #
      # `codeSign: true` puts the "Code Sign On Copy" flag on the build file, so
      # the helper is re-signed as it is embedded and the ad-hoc signature
      # survives into the bundle. Without it the app signs around a helper whose
      # own signature was made before the copy.
      - target: baia-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers

    settings:
      base:
        PRODUCT_NAME: baia
        PRODUCT_BUNDLE_IDENTIFIER: pasqualotto.baia
        MARKETING_VERSION: "0.2.0"
        # The build number, bumped for every installable rebuild of the same
        # marketing version. 2 is the first build whose bundle id is
        # `pasqualotto.baia`; build 1 was tagged before the rename and does not
        # produce the app in /Applications.
        CURRENT_PROJECT_VERSION: "5"

        # The commit the bundle was built from, expanded into `BAIAGitCommit` in
        # Info.plist the same way `BAIA_SUPPORT_DIRECTORY` is. Both versions
        # above are hand-edited constants, so every build between two edits has
        # the same release identity and nothing in the bundle says which source
        # it came from; the installed copy could only be tied to a commit by
        # the binary's mtime, which is an inference and not a record.
        #
        # The real value is passed on the xcodebuild command line by `make
        # build`, because no build setting can run git. What stands here is the
        # answer for a build that does not come through the Makefile, which is
        # the Xcode UI, and it says so rather than claiming a commit.
        #
        # A build phase was tried first and is the wrong mechanism: a script
        # writing into the built Info.plist races the task that processes it.
        # Measured 2026-08-02, and the failure is the bad kind. A clean build
        # stamped the right hash and the incremental build after it shipped
        # `unknown`, because nothing orders a phase with no declared inputs
        # against the plist task. Expansion cannot race: it happens inside that
        # task.
        BAIA_GIT_COMMIT: unknown

        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: baia.entitlements

        SWIFT_VERSION: "6.0"
        # Swift 6.2+ approachable concurrency. Everything is main-actor by
        # default, which is correct for an AppKit app and removes most of the
        # concurrency annotation noise. Drop these two first if the toolchain
        # rejects them.
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

        # Required: libghostty renders through CAMetalLayer / IOSurface.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

        ALWAYS_SEARCH_USER_PATHS: NO
        CLANG_ENABLE_MODULES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

        # Pinned rather than left to follow PRODUCT_NAME, which varies by config
        # below. Xcode derives the module name from the product name and
        # substitutes an underscore for the hyphen, so a Debug build would emit
        # `baia_dev.swiftmodule` and a Release build `baia.swiftmodule` for the
        # same sources. Nothing here imports the app target, so the drift would
        # surface late and somewhere else.
        PRODUCT_MODULE_NAME: baia

      # Two installable copies, and they must not share state.
      #
      # Release is the one that lives in /Applications and gets used. Debug is the
      # one `make run` launches to test the next change. The whole point is
      # running both at once, so every per-instance file has to be somewhere else
      # for each. Sharing them is not untidy, it is broken three ways: the second
      # instance to launch finds the socket taken and runs with no channel at all,
      # so `baia` inside its panes fails; `session.json` has one writer at a time
      # and the loser's windows are gone; and one bundle id for two apps leaves
      # `open -b` picking whichever LaunchServices last registered.
      #
      # BAIA_SUPPORT_DIRECTORY is read back through Info.plist and names the
      # directory under Application Support holding `session.json`,
      # `control.sock` and `recent-projects.tsv`.
      #
      # `~/.config/baia/config.json` is deliberately NOT split. Testing a build
      # against settings that are not the ones in daily use tests the wrong thing,
      # and the settings file is written atomically through a pid-suffixed
      # temporary, so the shared writer is the safe part. Split it here too if a
      # settings change ever needs to be tried without living with it.
      configs:
        Debug:
          PRODUCT_NAME: baia-dev
          PRODUCT_BUNDLE_IDENTIFIER: pasqualotto.baia.dev
          BAIA_SUPPORT_DIRECTORY: baia-dev
          # The debug-dylib stub arrangement (a 16K launcher whose code lives
          # in baia-dev.debug.dylib) makes menu-bar clicks segfault on macOS
          # 26A5388g: the beta renders the menu bar in-process through SwiftUI,
          # and its gesture activation dies checking a garbage executor
          # identity (swift_task_isMainExecutorImpl) only under the stub, on a
          # virgin process, on the first click. Measured 2026-08-08 with the
          # click matrix in the vault's plan 2 crash amendment; Release never
          # had the stub, which is why the daily driver's menus survive. Turn
          # this back on only after a seed fixes the menu bar, and re-run that
          # matrix first.
          ENABLE_DEBUG_DYLIB: NO
        Release:
          PRODUCT_NAME: baia
          PRODUCT_BUNDLE_IDENTIFIER: pasqualotto.baia
          BAIA_SUPPORT_DIRECTORY: baia

  # The `baia` command every pane gets on its PATH.
  #
  # A separate target rather than a mode of the app, because the CLI is a process
  # a shell runs and the app is a process that owns a socket, and they share only
  # `PaneControl`. Sharing the package is the point: client and server cannot
  # disagree about the wire, because there is one definition of it and both are
  # built from the same commit.
  #
  # Sources live in `CLI/` rather than under `Sources/`, which the app target
  # takes whole. A subdirectory there plus an `excludes:` entry would compile a
  # second `main` into the app the day the exclude was dropped, and that is the
  # same failure the `Icon/` comment above exists to prevent.
  baia-cli:
    type: tool
    platform: macOS

    sources:
      - path: CLI

    dependencies:
      - package: PaneControl
      # Parsing, exit statuses, help text and rendering. They live in a package
      # rather than in `CLI/` for one reason: `make test` iterates `Packages/*`,
      # so a decidable thing left in this target is a thing no test can reach.
      # What stays here is what needs a socket, an environment, or a file
      # descriptor.
      - package: PaneCLI
      # The hook, the settings merge and the installer. Here rather than in the
      # app for the same reason as the two above: `install-hooks` is a CLI
      # subcommand and never crosses the socket, so nothing in the app needs it.
      - package: AgentIntegration

    settings:
      base:
        # The product is `baia`, so what a pane types is `baia` and not
        # `baia-cli`. The target keeps the longer name because two targets named
        # `baia` cannot coexist, and the app's own product is `baia.app`, so
        # nothing collides in the products directory.
        PRODUCT_NAME: baia
        PRODUCT_BUNDLE_IDENTIFIER: pasqualotto.baia.cli

        # The Swift module name, which otherwise follows PRODUCT_NAME and would
        # be `baia` for both targets. Two targets emitting `baia.swiftmodule`
        # into one products directory is four `Multiple commands produce` errors
        # from the build system, and the message names swiftdoc and abi.json
        # rather than the product name they both came from. The executable a
        # pane types is still `baia`; only the module is renamed.
        PRODUCT_MODULE_NAME: baia_cli

        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

        # Matching the app: it runs under hardened runtime with an ad-hoc
        # signature, and an embedded helper signed any other way is a helper
        # macOS declines to execute out of that bundle.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

        # Nothing installs this. It ships inside the bundle, which is what makes
        # the tool exist exactly where the capability does: a shell outside baia
        # has no `baia` on PATH and no secret to use it with.
        SKIP_INSTALL: YES

        ALWAYS_SEARCH_USER_PATHS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

# Generated explicitly rather than left to Xcode.
#
# Without this block xcodegen produces the `baia` target and no scheme for it, so
# `make build` (which passes `-scheme baia`) worked only on a machine where
# somebody had opened the project in Xcode and let it autocreate one. That scheme
# lands in `xcuserdata`, which is gitignored, and every `make gen` wipes it. The
# result was a build that failed on a fresh clone, and after any regenerate, with
# an error naming a scheme rather than the missing declaration.
#
# `baia-cli` is deliberately absent: it is built as a dependency of the app, which
# is where it has to end up, and a scheme of its own would invite building it
# alone into a bundle nothing installs.
schemes:
  baia:
    build:
      targets:
        baia: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
