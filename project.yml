name: baia

options:
  bundleIdPrefix: gutons
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  libghostty:
    url: https://github.com/Lakr233/libghostty-spm
    from: "1.2.0"

targets:
  baia:
    type: application
    platform: macOS

    sources:
      - path: Sources

    # Info.plist and baia.entitlements are hand-maintained and wired in through
    # build settings below. Do NOT add `info:` or `entitlements:` keys here:
    # XcodeGen treats those as files it owns and overwrites them with generated
    # stubs on every `make gen`, silently dropping their contents.

    dependencies:
      - package: libghostty
        product: GhosttyTerminal
      - package: libghostty
        product: GhosttyTheme

    settings:
      base:
        PRODUCT_NAME: baia
        PRODUCT_BUNDLE_IDENTIFIER: gutons.baia
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: baia.entitlements

        SWIFT_VERSION: "6.0"
        # Swift 6.2+ approachable concurrency. Everything is main-actor by
        # default, which is correct for an AppKit app and removes most of the
        # concurrency annotation noise. Drop these two first if the toolchain
        # rejects them.
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

        # Required: libghostty renders through CAMetalLayer / IOSurface.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

        ALWAYS_SEARCH_USER_PATHS: NO
        CLANG_ENABLE_MODULES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
